<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aedesol AI Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --user-message-bg: #007bff; /* Bootstrap primary blue */
            --ai-message-bg: #e9ecef;   /* Bootstrap light gray */
            --body-bg: #f4f7f6;         /* Lighter gray */
            --container-bg: #ffffff;
            --text-color-light: #ffffff;
            --text-color-dark: #333333;
            --border-color: #dee2e6;
            --primary-font: 'Poppins', sans-serif;
            --base-font-size: 16px;
            --border-radius: 15px; /* Softer radius */
            --container-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --message-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        }

        body {
            background-color: var(--body-bg);
            font-family: var(--primary-font);
            font-size: var(--base-font-size);
            color: var(--text-color-dark);
            margin: 0;
            padding-top: 40px; /* Add space at the top */
            padding-bottom: 40px; /* Add space at the bottom */
        }

        .chat-container {
            max-width: 700px; /* Slightly wider */
            margin: auto;
            background: var(--container-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--container-shadow);
            display: flex;
            flex-direction: column;
            height: 85vh; /* More height */
            overflow: hidden; /* Prevent content spilling */
        }

        .chat-header {
            background-color: var(--user-message-bg);
            color: var(--text-color-light);
            padding: 15px 20px;
            border-top-left-radius: var(--border-radius);
            border-top-right-radius: var(--border-radius);
            text-align: center;
            font-weight: 500;
            font-size: 1.1em;
             box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Header shadow */
             z-index: 10; /* Ensure header is above chat box shadow */
        }

        #chat-box {
            flex-grow: 1; /* Takes available space */
            padding: 25px 20px;
            overflow-y: auto; /* Enable scrolling */
            background-color: #fdfdfd; /* Slightly off-white chat area */
        }

        /* Custom Scrollbar for WebKit Browsers */
        #chat-box::-webkit-scrollbar {
            width: 8px;
        }
        #chat-box::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }
        #chat-box::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        .message {
            margin-bottom: 20px; /* Increased spacing */
            padding: 12px 18px; /* More padding */
            border-radius: var(--border-radius);
            max-width: 75%; /* Max width for bubbles */
            line-height: 1.5;
            position: relative; /* Needed for pseudo-element tails */
            box-shadow: var(--message-shadow);
            word-wrap: break-word; /* Prevent long words from overflowing */
        }

        .user-message {
            background-color: var(--user-message-bg);
            color: var(--text-color-light);
            margin-left: auto; /* Align to right */
            border-bottom-right-radius: 5px; /* Sharper corner for tail */
        }
         /* User message tail */
        .user-message::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: -10px; /* Position tail outside the bubble */
            width: 0;
            height: 0;
            border: 15px solid transparent; /* Size of the tail */
            border-left-color: var(--user-message-bg);
            border-right: 0;
            border-bottom: 0;
            margin-top: -10px; /* Adjust vertical position */
        }


        .ai-message {
            background-color: var(--ai-message-bg);
            color: var(--text-color-dark);
            margin-right: auto; /* Align to left */
            border-bottom-left-radius: 5px; /* Sharper corner for tail */
        }
         /* AI message tail */
        .ai-message::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -10px; /* Position tail outside the bubble */
            width: 0;
            height: 0;
            border: 15px solid transparent; /* Size of the tail */
            border-right-color: var(--ai-message-bg);
            border-left: 0;
            border-bottom: 0;
            margin-top: -10px; /* Adjust vertical position */
        }

        .chat-input-area {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            background-color: var(--container-bg);
             box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.05); /* Shadow above input */
             z-index: 5; /* Ensure input area is above chat box scroll content */
             border-bottom-left-radius: var(--border-radius);
             border-bottom-right-radius: var(--border-radius);
        }

        .input-group { /* Using flex for better alignment */
            display: flex;
            align-items: center;
        }

        #user-input {
            flex-grow: 1;
            border-radius: 20px; /* Pill shape */
            border: 1px solid var(--border-color);
            padding: 10px 20px; /* More padding */
            margin-right: 10px;
            font-size: 0.95em;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        #user-input:focus {
            outline: none;
            border-color: var(--user-message-bg);
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        .send-button { /* Custom class for the button */
            border-radius: 50%; /* Circle button */
            width: 45px;
            height: 45px;
            background-color: var(--user-message-bg);
            color: white;
            border: none;
            font-size: 1.3em; /* Adjust icon size if using */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.1s ease;
            flex-shrink: 0; /* Prevent button from shrinking */
        }

        .send-button:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }
         .send-button:active {
            transform: scale(0.95); /* Click effect */
         }

        /* Simple send icon using SVG (inline) */
        .send-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* -- Styling for Thinking Indicator -- */
        #thinking-indicator {
            display: flex; /* Use flex to align dots if needed */
            align-items: baseline;
        }
        #thinking-indicator span {
            display: inline-block; /* Needed for animation */
            opacity: 0;
            animation: blink 1.4s infinite;
            margin-left: 1px; /* Spacing between dots */
        }
        #thinking-indicator span:nth-child(2) { animation-delay: 0.2s; }
        #thinking-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        /* -- End Thinking Indicator Styling -- */

        /* Style for error messages */
         .error-message {
            background-color: #f8d7da !important; /* Make sure it overrides ai-message bg */
            color: #721c24 !important;
            border: 1px solid #f5c6cb;
        }
        /* Optional: Adjust tail color for errors */
        .error-message::after {
             border-right-color: #f8d7da !important;
        }

    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            Aedesol AI Assistant
        </div>
        <div id="chat-box">
            <div class="message ai-message">Hello! How can I help you today?</div>
        </div>
        <div class="chat-input-area">
            <div class="input-group">
                <input type="text" id="user-input" class="form-control" placeholder="Type your message here...">
                 <button class="send-button" onclick="sendMessage()" aria-label="Send Message">
                    <svg class="send-icon" viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const backendURL = "https://fixibo.onrender.com/chat";
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const typingSpeed = 40; // Milliseconds per character (adjust speed as needed)

        // --- Helper Functions ---

        // Scrolls the chat box to the bottom smoothly
        function scrollToBottom() {
            chatBox.scrollTo({
                top: chatBox.scrollHeight,
                behavior: 'smooth'
            });
        }

        // Displays a message instantly (used for user messages and errors)
        function displayMessage(text, className) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", className);
            messageDiv.textContent = text; // Using textContent for safety against XSS
            chatBox.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv; // Return the created element
        }

        // Shows the "Thinking..." indicator
        function showThinkingIndicator() {
            const thinkingDiv = document.createElement("div");
            thinkingDiv.id = "thinking-indicator"; // Assign ID for easy removal
            thinkingDiv.classList.add("message", "ai-message"); // Style like AI message
            // Use innerHTML for the spans needed for animation
            thinkingDiv.innerHTML = 'Thinking<span>.</span><span>.</span><span>.</span>';
            chatBox.appendChild(thinkingDiv);
            scrollToBottom();
        }

        // Removes the "Thinking..." indicator
        function hideThinkingIndicator() {
            const thinkingDiv = document.getElementById("thinking-indicator");
            if (thinkingDiv) {
                thinkingDiv.remove();
            }
        }

        // Displays the AI message with a typing effect
        function displayAiMessageWithTyping(text) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", "ai-message");
            // Add empty div first
            chatBox.appendChild(messageDiv);
            scrollToBottom(); // Scroll when the empty bubble is added

            let i = 0;
            function typeChar() {
                if (i < text.length) {
                    // Append character - Use textContent to prevent XSS if the reply isn't guaranteed safe HTML
                    messageDiv.textContent += text.charAt(i);
                    i++;
                    scrollToBottom(); // Keep scrolling as content grows
                    setTimeout(typeChar, typingSpeed);
                }
                 // Optional: final scroll can be added here if needed, but continuous scroll should suffice.
            }
            typeChar(); // Start the typing animation
        }

        // --- Core Chat Logic ---

        async function sendMessage() {
            const userPrompt = userInput.value.trim();
            if (!userPrompt) return;

            displayMessage(userPrompt, 'user-message'); // Display user message instantly
            userInput.value = ""; // Clear input
            userInput.focus(); // Keep focus on input

            showThinkingIndicator(); // Show "Thinking..."

            try {
                const response = await fetch(backendURL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: userPrompt })
                });

                hideThinkingIndicator(); // Hide "Thinking..." before displaying response or error

                if (!response.ok) {
                    // Handle HTTP errors (e.g., 404, 500)
                    let errorText = `HTTP error! Status: ${response.status}`;
                    try {
                        // Try to get more specific error details from response body if available
                        const errorData = await response.json();
                        if (errorData && errorData.error) {
                           errorText += ` - ${errorData.error}`;
                        } else if (errorData && errorData.detail) {
                           errorText += ` - ${errorData.detail}`;
                        }
                    } catch (e) {
                        // Ignore if response body isn't JSON or empty
                    }
                    throw new Error(errorText);
                }

                const data = await response.json();

                if (data && data.reply) {
                    displayAiMessageWithTyping(data.reply); // Display AI response with typing effect
                } else {
                    console.error("Unexpected response format:", data);
                    displayMessage("Received an unexpected response format from the server.", 'ai-message error-message');
                }

            } catch (error) {
                 hideThinkingIndicator(); // Ensure indicator is hidden on fetch/network error too
                 console.error("Fetch/Processing Error:", error);
                 // Display a user-friendly error message instantly
                 displayMessage(`Error: Could not get response. ${error.message}`, 'ai-message error-message');
            }
        }

        // --- Event Listeners ---

        // Send message on Enter key press in the input field
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault(); // Prevent default Enter behavior (like form submission)
                sendMessage();
            }
        });

        // Initial focus on the input field when the page loads
         window.onload = () => {
             userInput.focus();
         }

    </script>
</body>
</html>
